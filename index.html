<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>COBRA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Cobra — a modern remake of Ocean Software's 1986 C64 classic. Crime is a disease. He's the cure.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Special+Elite&family=Share+Tech+Mono&display=swap">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
  /* Single-look design: a dark neo-noir arcade screen in every theme. */
  :root {
    color-scheme: dark;
    --bg: #04050a;
    --fg: #e9eefb;
    --hud-fg: #e9eefb;
    --muted: #8a93ad;
    --neon-a: #ff2f8e;
    --neon-b: #2fd2ff;
    --chrome-hi: #ffffff;
    --chrome-lo: #6f7fa8;
    --danger: #ff3b4a;
    --font-display: 'Teko', 'Arial Narrow', 'Roboto Condensed', sans-serif;
    --font-type: 'Special Elite', 'Courier New', monospace;
    --font-mono: 'Share Tech Mono', ui-monospace, 'Consolas', monospace;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; overscroll-behavior: none; }
  body { font-family: var(--font-display); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; touch-action: none; }
  #app { position: fixed; inset: 0; background: var(--bg); }
  #app canvas { display: block; width: 100%; height: 100%; outline: none; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  #ui .interactive { pointer-events: auto; }
  #boot { position: absolute; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 50; transition: opacity .8s; }
  #boot.done { opacity: 0; pointer-events: none; }
  #boot .t { font-family: var(--font-mono); letter-spacing: .4em; color: var(--muted); font-size: 14px; text-align: center; }
  #boot .bar { width: 220px; height: 2px; background: #1a1d29; margin: 14px auto 0; overflow: hidden; }
  #boot .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--neon-a), var(--neon-b)); transition: width .3s; }
  /* ready: the bar goes away and a big pulsing prompt takes over, so it can't pass for "still loading" */
  #boot.ready { cursor: pointer; }
  #boot.ready .bar { opacity: 0; height: 0; margin: 0; transition: opacity .4s, height .4s, margin .4s; }
  #boot .ok { color: var(--neon-b); font-size: 12px; letter-spacing: .5em; margin-bottom: 14px; text-shadow: 0 0 10px rgba(47,210,255,.5); }
  #boot .go { font-family: var(--font-display); font-weight: 600; font-size: clamp(30px, 6vw, 56px); line-height: 1; letter-spacing: .26em; padding-left: .26em; color: #fff;
    text-shadow: 0 0 10px var(--neon-a), 0 0 30px rgba(255,47,142,.6); animation: boot-in .6s ease-out both, boot-pulse 1.2s ease-in-out .6s infinite; }
  #boot .sub { font-size: 11px; letter-spacing: .3em; color: var(--muted); opacity: .75; margin-top: 18px; }
  @keyframes boot-in { 0% { opacity: 0; transform: scale(1.3); filter: brightness(3); } 55% { opacity: 1; } 100% { transform: none; filter: none; } }
  @keyframes boot-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; text-shadow: 0 0 4px rgba(255,47,142,.4); } }
  @media (prefers-reduced-motion: reduce) { #boot .go { animation: none; } }
  .touch { position: absolute; inset: auto 0 0 0; height: 0; pointer-events: none; z-index: 20; }
  .touch button { pointer-events: auto; position: absolute; border: 1px solid rgba(255,255,255,.25); background: rgba(10,12,20,.45); color: #fff; font-family: var(--font-display); font-size: 20px; border-radius: 50%; width: 64px; height: 64px; backdrop-filter: blur(4px); touch-action: none; }
  .touch .pad { position: absolute; left: max(16px, env(safe-area-inset-left)); bottom: calc(18px + env(safe-area-inset-bottom)); width: 190px; height: 190px; }
  .touch .pad button[data-a=up] { left: 63px; top: 0; } .touch .pad button[data-a=down] { left: 63px; bottom: 0; }
  .touch .pad button[data-a=left] { left: 0; top: 63px; } .touch .pad button[data-a=right] { right: 0; top: 63px; }
  .touch .acts { position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); width: 220px; height: 150px; }
  .touch .acts button[data-a=jump] { right: 0; bottom: 0; width: 84px; height: 84px; }
  .touch .acts button[data-a=fire] { right: 96px; bottom: 10px; width: 84px; height: 84px; font-size: 16px; background: rgba(120,10,40,.5); }
  .touch .acts button[data-a=grenade] { right: 30px; bottom: 100px; width: 52px; height: 52px; }
  .touch .pausebtn { right: max(16px, env(safe-area-inset-right)); top: calc(90px + env(safe-area-inset-top)); width: 44px !important; height: 44px !important; font-size: 16px !important; }
  .touch .pausebtn { position: fixed !important; }
  :focus-visible { outline: 2px solid var(--neon-b); outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>
<div id="ui"></div>
<div id="boot"><div><div class="t" role="status" aria-live="polite">LOADING THE CITY</div><div class="bar"><i id="bootbar"></i></div></div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
